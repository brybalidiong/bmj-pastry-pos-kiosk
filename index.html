<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d3461">
    <title>Order Pastries | BMJ Pastry POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/catalog.css">
    <script src="assets/js/shell.js" defer></script>
    <script src="assets/js/products.js" defer></script>
    <script src="assets/js/order-store.js" defer></script>
    <script src="assets/js/catalog.js" defer></script>
  </head>
  <body data-stage="order" data-page="catalog">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header" id="site-header"></header>
    <main class="kiosk-main" id="main-content">
      <div class="order-layout">
        <section class="surface catalog-panel" aria-labelledby="catalog-title">
          <label class="catalog-search" for="catalog-search-input">
            <span aria-hidden="true">⌕</span>
            <input id="catalog-search-input" type="search" placeholder="Search pastries, breads, coffee" autocomplete="off" aria-label="Search products">
            <span class="search-preview" id="catalog-result-count" aria-live="polite">Menu</span>
          </label>
          <div class="catalog-top">
            <div>
              <p class="eyebrow">Step 01 / Build an order</p>
              <h1 id="catalog-title">Tap a product to add it</h1>
              <p>Choose from the menu, then review your order.</p>
            </div>
            <div class="chip-row" role="group" aria-label="Product categories">
              <button class="chip is-active" type="button" data-category="All" aria-pressed="true">All</button>
              <button class="chip" type="button" data-category="Pastries" aria-pressed="false">Pastries</button>
              <button class="chip" type="button" data-category="Breads" aria-pressed="false">Breads</button>
              <button class="chip" type="button" data-category="Desserts" aria-pressed="false">Desserts</button>
              <button class="chip" type="button" data-category="Coffee" aria-pressed="false">Coffee</button>
            </div>
          </div>
          <div class="product-grid" id="product-grid" aria-label="Menu products"></div>
          <p class="catalog-empty" id="catalog-empty" hidden>No products match your search. Try another term or category.</p>
          <noscript><p class="catalog-empty">JavaScript is required to build an order.</p></noscript>
        </section>

        <aside class="surface cart-panel" aria-labelledby="cart-title">
          <div class="cart-head"><h2 id="cart-title">Your Order</h2><span class="cart-count" id="cart-count">0 items</span></div>
          <div class="cart-items" id="cart-items" aria-live="polite"></div>
          <div class="cart-total"><span>Total</span><strong id="cart-total">₱0.00</strong></div>
          <a class="button button-primary button-wide review-link is-disabled" id="review-link" href="pages/order-summary.html" aria-disabled="true">Review order <span aria-hidden="true">→</span></a>
          <p class="cart-feedback" id="cart-feedback" role="status" aria-live="polite">Add an item to start your order.</p>
        </aside>
      </div>
    </main>
  </body>
</html>
